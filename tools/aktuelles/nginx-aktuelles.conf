# Aktuelles /news/ (OpenProject 74, Zusatz)
# Ziel auf dem Server: /home/radmin/conf/web/randl.group/nginx.ssl.conf_aktuelles
# (und gleich als nginx.conf_aktuelles), eingebunden ueber nginx.ssl.conf_*.
# Rueckgaengig: Datei entfernen, nginx -t, systemctl reload nginx.

# 1) Punkt-Dateien unter /news/ sperren (.beitraege.json, .vorlage.html).
#    ^~ ist noetig: Sonst liefert der .html-Block in "location /" die
#    Vorlage aus, bevor die allgemeine Punkt-Datei-Sperre greift.
location ^~ /news/. {
        return 404;
}

# 2) Beitragsseiten direkt ausliefern. Fehlt die Seite (deaktiviert,
#    geloescht, Entwurf, Tippfehler), leitet nginx dauerhaft auf die
#    Uebersicht um. /news/ selbst und /news/<slug> ohne Schraegstrich
#    gehen weiter wie bisher an Apache.
location ~ ^/news/[a-z0-9-]+/$ {
        root       /home/radmin/web/randl.group/public_html;
        try_files  $uri/index.html @news_archiv;
        access_log /var/log/apache2/domains/randl.group.log combined;
        access_log /var/log/apache2/domains/randl.group.bytes bytes;
        expires    epoch;
}
location @news_archiv {
        return 301 https://randl.group/news/;
}
